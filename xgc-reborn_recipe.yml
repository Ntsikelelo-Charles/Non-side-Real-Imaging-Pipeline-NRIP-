#!/usr/bin/env -S stimela run 
_include:    
      - xgc-reborn_cabs.yml
            
opts:

      backend:
    
            select:
                  - singularity
                  - native
            rlimits:
                  NOFILE: 100000 
     
      log:
    
            nest: 2
            level: INFO
            enable: true
            symlink: log
            name: log-{info.fqname}
            dir: 'logs/log-{config.run.datetime}'
        
xgc-reborn:

      name: xgc-reborn
      info: A Generic Pipeline for Polarization Calibration and Imaging for MeerKAT Telescope
      
      assign:
            dirs.base: .
            dirs.temp: '{config.run.env.HOME}/tmp'
            log.dir: '{recipe.logdir}/log-{config.run.datetime}'
                  
      assign_based_on:
            _include: xgc-reborn_obs.yml
            
      
            
      outputs:
            _include: ./defaults/outputs/outputs.yml

      inputs:
            _include: ./defaults/inputs/inputs.yml 
            copy-model-columns:
                  dtype: bool
                  default: true
            initial-flag-version:
                  default: init
            stokes:
                  default: IQUV
            pa-rotate:
                  dtype: bool
                  default: true
            mad-flag:
                  info: enable the QuartiCal MAD residual flagger
                  dtype: bool
                  default: true
            ncpu:
                  default: 64
            upsample-channels:
                  dtype: Optional[int]
                  default: 64
      
                        
        
      steps:
            
            obsinfo-ms:
                  _use: lib.steps.prepdata.listobs.ms
                  info: Generate the observation information of the ms
                  params:
                        listfile: '{recipe.obsdir}/obsinfo-ms.txt' 
                        
            transform-cals:
                  info: 'Transform, edit and manipulate calibrator-only ms'
                  recipe: transform-cals
                  params:
                        field: '{recipe.bpcal-field}, {recipe.gcal-field}, {recipe.xcal-field}' 
                        
            flag-cals:
                  info: 'Flag and inspect calibrator-only ms'
                  recipe: flag-cals
                  params:
                        field: '{recipe.bpcal-field},{recipe.gcal-field},{recipe.xcal-field}'
                                                       
            unflag-cals:
                  _use: lib.steps.flagdata.unflag.calibrators 
                  info: 'Unflag data based on selected parameters, field,spw,antenna etc'
                  params:
                        field: '{recipe.bpcal-field}, {recipe.gcal-field}, {recipe.xcal-field}' 
                  skip: true  
             
            prim-flags:
                  _use: lib.steps.flagdata.save-flags.calibrators
                  info: Back up flags before performing calibration on bandpass calibrator. 
                  params:
                        versionname: pre-bpcal_flags
                              
            prim-model:
                  _use: lib.steps.calibration.primary.model.crystalball
                  info: 'Populate MODEL_DATA column'
                  params:
                        points-only: '{recipe.crystallball_points-only}'
            

            prim-K0:
                  _use: lib.steps.calibration.primary.prim-K0
                  info: Antenna based delay calibration on bandpass calibrator (bpcal-field)
                  params:
                        combine: ''
                        solint: 'inf'
                  
            prim-Gp0: 
                  _use: lib.steps.calibration.primary.prim-Gp0
                  info: Complex gain phase calibration on bandpass calibrator (bpcal-field)
                  params:
                        combine: ''
                        solint: 'inf'
                  
            prim-Ga0:
                  _use: lib.steps.calibration.primary.prim-Ga0
                  info: Complex gain amplitude calibration on bandpass calibrator (bpcal-field)
                  params:
                        combine: ''
                        solint: 'inf'
             
            prim-B0:
                  _use: lib.steps.calibration.primary.prim-B0
                  info: Solve for frequency dependent bandpass variations on bandpass calibrator (bpcal-field)
                  params:
                        combine: ''
                        solint: 'inf'
             
            prim-Df0:
                  _use: lib.steps.calibration.primary.prim-Df0
                  info: Polarization leakage calibration using unpolarized calibrator
                  params: 
                        solint: 'inf'
                        combine: 'scan' 
             
            flag-prim-Df0:
                  _use: lib.steps.flagdata.flag-clip.corrected.leakages.prim-Df0
                  info: Flag leakage solutions. 
                  params:  
                        clipminmax: [0.0,0.1] 
                  
            apply-prim0:
                  _use: lib.steps.calibration.applycal.applyprim0
                  info: Apply the calibration solution  to the primary calibrator 
                  params:
                        parang: false
             
            flag-prim:
                  _use: lib.steps.flagdata.flag-tfcrop.corrected.prim
                  info: Flagging corrected data using tfcrop
                  params: 
                        datacolumn: 'CORRECTED'
             
            prim-K1:
                  _use: lib.steps.calibration.primary.prim-K1
                  info: Antenna based delay calibration on bandpass calibrator (bpcal-field)
                  params:
                        combine: ''
                        solint: '60s'
                  
            prim-Gp1: 
                  _use: lib.steps.calibration.primary.prim-Gp1
                  info: Complex gain phase calibration on bandpass calibrator (bpcal-field)
                  params:
                        combine: ''
                        solint: '60s'
             
            prim-Ga1: 
                  _use: lib.steps.calibration.primary.prim-Ga1
                  info: Complex gain amplitude calibration on bandpass calibrator (bpcal-field)
                  params:
                        combine: ''
                        solint: '60s'
   
            prim-B1:
                  _use: lib.steps.calibration.primary.prim-B1
                  info: Solve for frequency dependent bandpass variations on bandpass calibrator (bpcal-field)
                  params:
                        solint: 'inf'
                        combine: 'scan'
             
            prim-Df1:
                  _use: lib.steps.calibration.primary.prim-Df1
                  info: Polarization leakage calibration using unpolarized calibrator
                  params: 
                        solint: 'inf'
                        combine: 'scan' 
             
            flag-prim-Df1:
                  _use: lib.steps.flagdata.flag-clip.corrected.leakages.prim-Df1
                  info: Flag leakage solutions. 
                  params:  
                        clipminmax: [0.0,0.1] 
             
            prim-K2:
                  _use: lib.steps.calibration.primary.prim-K2
                  info: Antenna based delay calibration on bandpass calibrator (bpcal-field)
                  params:
                        solint: 'inf'
                        combine: 'scan'
                        
            inspect1-gains:
                  info: 'Inspect primary calibration gain solutions'
                  recipe: inspect-prim
                  params:
                        field: '{recipe.bpcal-field}' 
              
            apply-prim1:
                  _use: lib.steps.calibration.applycal.applyprim1
                  info: Apply the calibration solution  on bandpass calibrator
                  params: 
                        parang: false
                 
            sec-calflags:
                  _use: lib.steps.flagdata.save-flags.calibrators
                  info: Back up flags before performing secondary calibration. 
                  params:
                        versionname: pre_gcalflags
             
            sec-model:
                  _use: lib.steps.calibration.secondary.model
                  info: Fill the model column with the visibilities of a calibrator
                  params: 
                        fluxdensity:  [1,0,0,0]
                  
            sec-Gp0: 
                  _use: lib.steps.calibration.secondary.sec-Gp0
                  info: Complex gain phase calibration on secondary calibrator (gcal-field)
                  params:  
                        combine: ''
                        solint: 'inf'
             
            sec-Ga0:
                  _use: lib.steps.calibration.secondary.sec-Ga0    
                  info: Complex gain amplitude calibration on secondary calibrator (gcal-field)
                  params:
                        combine: ''
                        solint: 'inf'
                   
            apply-sec0:
                  _use: lib.steps.calibration.applycal.applysec0
                  info: Apply the Secondary calibration solution 
                  params: 
                        parang: false
             
            flag-sec0:
                  _use: lib.steps.flagdata.flag-tfcrop.corrected.sec
                  info: Flag corrected data using tfcrop
                  params: 
                        datacolumn: 'CORRECTED' 
                  
            sec-Gp1:
                  _use: lib.steps.calibration.secondary.sec-Gp1 
                  info: Initial Gain phase calibration on secondary calibrator
                  params:
                        combine: ''
                        solint: 'inf'
             
            sec-Ga1:
                  _use:  lib.steps.calibration.secondary.sec-Ga1  
                  info: Initial Gain Amp calibration on secondary calibrator
                  params:
                        combine: ''
                        solint: 'inf' 
                  
            sec-F0:
                  _use: lib.steps.calibration.secondary.sec-F0
                  info: fluxscale
                  params:
                        transfer: ['']
             
            apply-sec1:
                  _use: lib.steps.calibration.applycal.applysec1
                  info: Apply the calibration solutions to the Secondary
                  params: 
                        parang: false
                        
            inspect2-gains:
                  info: 'Inspect secondary calibration gain solutions'
                  recipe: inspect-sec
                  params:
                        field: '{recipe.gcal-field}'     
             
            apply2Pol:
                  _use: lib.steps.calibration.applycal.apply2pol
                  info: Apply the calibration solution to Polarization calibrator
                  params:
                        parang: false
                    
            pol-calflags:
                  _use: lib.steps.flagdata.save-flags.calibrators
                  info: Back up flags before performing polarization calibration
                  params: 
                        versionname: pre_xcalflags
               
            flag-extend:
                  _use: lib.steps.flagdata.flag-extend
                  info: 'Extend flags' 
                  params:
                        action: 'apply'      
            
            pol-model:
                  _use: lib.steps.calibration.polarization.model
                  info: Fill the model column with the visibilities of a calibrator
                  params:    
                        field: '{recipe.xcal-field}'
                
            pol-Gp0:
                  _use:  lib.steps.calibration.polarization.pol-Gp0 
                  info: Complex gain phase calibration on polarization calibrator field (xcal-field)
                  params:
                        combine: '' 
                        solint: 'int'
                
            pol-KCROSS: 
                  _use: lib.steps.calibration.polarization.pol-KCROSS  
                  info: Cross-hand delay calibration polarization calibrator (xcal-field)
                  params:
                        combine: '' 
                        solint: 'inf'
                
            pol-Xf:
                  _use: lib.steps.calibration.polarization.pol-Xf 
                  info: Cross-hand phase calibration on polarization calibrator  (xcal-field)
                  params:
                        combine: '' 
                        solint: 'inf' 
                
            pol-Xf1:
                  _use: lib.steps.calibration.polarization.pol-Xf1 
                  info: Cross-hand phase calibration on polarization calibrator  (xcal-field)
                  params:
                        solint: 'inf'
                        combine: 'scan'
                   
            flag-pol-Xf1:
                  _use: lib.steps.flagdata.flag-tfcrop.corrected.xphase
                  info: Flag corrected data using tfcrop
                  params: 
                        ntime: '60s'
                        
            inspect3-gains:
                  info: 'Inspect polarization calibration gain solutions'
                  recipe: inspect-pol
                  params:
                        field: '{recipe.xcal-field}' 
                       
            applycal-prim:
                  _use: lib.steps.calibration.applycal.applycal2prim
                  info: Apply the  calibration solution to Primary field calibrator
                  params: 
                        parang: true
                 
            applycal-sec:
                  _use: lib.steps.calibration.applycal.applycal2sec
                  info: Apply the calibration solution to Secondary field calibrator
                  params: 
                        parang: true
                        
            applycal-pol:
                  _use: lib.steps.calibration.applycal.applycal2pol
                  info: Apply the calibration solution to Polarization field calibrator
                  params: 
                        parang: true
                        
            inspect-cals:
                  info: 'Inspect full polarization calibration solutions'
                  recipe: inspect-vis
                  params:
                        field: '{recipe.bpcal-field},{recipe.gcal-field},{recipe.xcal-field}' 
                        
            transform-target:
                  info: 'Transform, edit and manipulate target-only ms'
                  recipe: transform-target
                  params:
                        field: '{recipe.target-field}'
                        
            flag-target:
                  info: 'Flag and inspect target-only ms'
                  recipe: flag-target
                  params:
                        field: '{recipe.target-field}'
                                          
            unflag-target:
                  _use: lib.steps.flagdata.unflag.target 
                  info: 'Unflag data based on selected parameters, field,spw,antenna etc'
                  params:
                        field: '{recipe.target-field}'
                  skip: true  
                       
            applycal-target:
                  _use: lib.steps.calibration.applycal.applycal2target
                  info: Apply the  calibration solution to target field 
                  params: 
                        parang: true
                        
            flag-target-corr:
                  _use: lib.steps.flagdata.flag-tfcrop.corrected.target
                  info: Flag corrected data using tfcrop
                  params: 
                        datacolumn: 'CORRECTED' 
                  skip: true  
            image-1:
                  _use: lib.steps.wsclean.image_pol
                  params:
                        pol: IQ
                        column: CORRECTED_DATA

            mask-1:
                  cab: breizorro
                  params:
                        restored-image: '{steps.image-*.prefix}-MFS-I-image.fits'
                        outfile: '{steps.image-*.prefix}-mask.fits'
                        threshold: 10
                        dilate: 5

            image-2:
                  _use: lib.steps.wsclean.image_pol
                  params:
                        column: 'CORRECTED_DATA'
                        fits-mask: "{steps.mask-*.outfile}"
                        niter: 100000
                        pol: IQ            

            selfcal-1:
                  _use: lib.steps.selfcal.direction-independent
                  info: Perform round of direction-independent selfcal
                  params:
                        input_ms.data_column: "{steps.image-*.column}"
                        output.columns: ['CORRECTED1_DATA']
                        output.products: [corrected_data]
                        solver.terms: [K]
                        solver.iter_recipe: [100]
                        dask.threads: 8 
                        mad_flags.enable: false

            image-3:
                  _use: lib.steps.wsclean.image_pol
                  params:
                        column: 'CORRECTED1_DATA'
                        fits-mask: "{steps.mask-*.outfile}"
                        niter: 100000
                        pol: IQ

                  
            mask-2:
                  cab: breizorro
                  params:
                        restored-image: ='{steps.image-*.prefix}-MFS-I-image.fits'
                        outfile: '{steps.image-*.prefix}-mask.fits'

            upsample-3:
                  cab: smops
                  skip: =not recipe.upsample-channels
                  params:
                        ms: ='{recipe.msdir}/target.ms'
                        input-prefix: =steps.image-*.prefix
                        num-threads: =recipe.ncpu
                        stokes: IQ
                        channels-out: =recipe.upsample-channels
                        polynomial-order: 4
                        output-prefix: "{steps.image-*.prefix}-upsampled"

            predict-3:
                  _use: lib.steps.wsclean.predict_pol
                  params:
                        prefix: =IF(recipe.upsample-channels, steps.upsample-*.output-prefix, steps.image-*.prefix)
                        nchan: =IF(recipe.upsample-channels, steps.upsample-*.channels-out, steps.image-*.nchan)
                        pol: IQ

            predict-copycol-3:
                  skip: =not recipe.copy-model-columns
                  cab: msutils.copycol
                  params:
                        msname: ='{recipe.msdir}/target.ms'
                        fromcol: MODEL_DATA
                        tocol: =IF(recipe.upsample-channels, 'MODEL1_{recipe.upsample-channels}_DATA', 'MODEL_DATA')

            selfcal-2:
                  _use: lib.steps.selfcal.direction-independent
                  info: Perform round of direction-independent selfcal
                  params:
                        input_ms.data_column: CORRECTED1_DATA
                        output.columns: ['CORRECTED2_DATA']
                        solver.terms: [K]
                        solver.iter_recipe: [100]
                        dask.threads: 8 
                        mad_flags.enable: false
                        input_model.recipe: =steps.predict-copycol-*.tocol

            image-4:
                  _use: lib.steps.wsclean.image_pol
                  params:
                        prefix: ="{recipe.imdir}/image-upsampled_{info.suffix}"
                        column: 'CORRECTED2_DATA'
                        fits-mask: =steps.mask-*.outfile
                        niter: 100000
                        pol: IQUV

            
