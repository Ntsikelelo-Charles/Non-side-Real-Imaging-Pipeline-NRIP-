  get-field-names:
    flavour: python-code
    command: |
      from casacore.tables import table

      # FIELD table
      with table(ms + "/FIELD", readonly=True) as field:
          field_names = field.getcol("NAME")

      # STATE table
      with table(ms + "/STATE", readonly=True) as state:
          state_obs_mode = state.getcol("OBS_MODE")

      # MAIN table
      with table(ms, readonly=True) as main:
          field_id = main.getcol("FIELD_ID")
          state_id = main.getcol("STATE_ID")

      # Find e.g., TARGET state IDs
      target_state_ids = set()

      for i, mode in enumerate(state_obs_mode):
          if type_field in mode.upper():
              target_state_ids.add(i)

      # Find fields associated with e.g TARGETS states
      target_field_ids = set()

      for fid, sid in zip(field_id, state_id):
          if sid in target_state_ids:
              target_field_ids.add(fid)

      target_field_names = [
          field_names[fid] for fid in sorted(target_field_ids)
      ]

      if not target_field_names:
          raise RuntimeError("No "+type_field+" field found.")

      if type_field=="TARGET" and len(target_field_names) > 1:
          raise RuntimeError(
              f"Multiple TARGET fields found: {target_field_names}"
          )

      field_name = target_field_names[0]
      print(f"{type_field} name is {field_name}")
      
      print(f"{type_field} name is {field_name}")

      # Write the field name to a text file
      with open(output_file, "w") as f:
          f.write(field_name + "\n")

      print(f"Wrote field name to: {output_file}")

    inputs:
      ms:
        info: Path to the measurement set.
        dtype: MS
        policies:
          positional: true
        must_exist: true

      type_field:
        dtype: str
        required: true

      output_file:
        dtype: File
        required: true


  fix-ms-direction:
    info: gets direction of given solar system body for mid-point of MS
    inputs:
      ms:
        dtype: MS
        required: true
        writable: true
      body:
        dtype: str
        required: true
    flavour: python-code
    command: |
      import sys
      import casacore.measures
      import casacore.quanta 
      from casacore.tables import table
      dm = casacore.measures.measures() 
      dq = casacore.quanta
      newdir = dm.direction(body)
      print(ms)
      tab = table(ms, readonly=False)
      t = tab.getcol("TIME")
      t0 = (t.min() + t.max())/2
      ep = dm.epoch('utc', dq.quantity(t0, 's'))
      dm.do_frame(ep)
      radec = dm.measure(newdir, 'J2000')
      ra = dm.get_value(radec)[0].get_value('rad')
      dec = dm.get_value(radec)[1].get_value('rad')
      print(f"time {t0} {body} ra {ra} dec {dec}")
      ftab = table(f"{ms}::FIELD", readonly=False)
      for colname in 'DELAY_DIR', 'PHASE_DIR', 'REFERENCE_DIR':
          col = ftab.getcol(colname)
          print(col)
          col[0,0,0] = ra
          col[0,0,1] = dec
          ftab.putcol(colname, col)
          print(colname, col)

  casa.fixuvw:
    flavour: casa-task
    command: fixvis
    inputs:
      ms: 
        dtype: MS
        required: true
        nom_de_guerre: vis
      reuse:
        dtype: bool
        implicit: false
    outputs:
      outputvis:
        implicit: '{current.ms}'

  casa.split.scan:
    command: split
    flavour: casa-task
    inputs:
      source-ms:
        dtype: MS
        required: true
        nom_de_guerre: vis
      scan:
        dtype: str
      datacolumn:
        default: corrected  
    outputs:
      ms:
        dtype: MS
        required: true
        nom_de_guerre: outputvis

  weighted-mean-image:
    info: 
      computes the mean of a series of FITS images, using inverse variance weighting
    inputs:
      images: 
        dtype: List[File]
      residuals: 
        dtype: List[File]
      exclude_center:
        info: exclude a box of this size at the image centre when computing variance
        dtype: int
        default: 1000
    outputs:
      output_image: 
        dtype: File
      output_residual: 
        dtype: File
    flavour: python-code
    command: |
        from astropy.io import fits
        import numpy as np
        from numpy.ma import masked_array
        ffs = [fits.open(path) for path in images]
        ims = [ff[0].data for ff in ffs]
        rffs = [fits.open(path) for path in residuals]
        rims = rims_masked = [ff[0].data for ff in rffs]
        if exclude_center:
          mask = np.zeros_like(ims[0], bool)
          i0 = mask.shape[-1]//2 - exclude_center//2
          i1 = mask.shape[-1]//2 + exclude_center//2
          j0 = mask.shape[-2]//2 - exclude_center//2
          j1 = mask.shape[-2]//2 + exclude_center//2
          mask[..., j0:j1, i0:i1] = True
          rims_masked = [masked_array(im, mask) for im in rims]
        istds = [1/im.std() for im in rims_masked]
        print(f"Inverse residual variances are {istds}")
        mean = sum([im*istd for (im, istd) in zip(ims, istds)]) / sum(istds)
        rmean = sum([im*istd for (im, istd) in zip(rims, istds)]) / sum(istds)
        ffs[0][0].data = mean.data
        ffs[0].writeto(output_image, overwrite=True) 
        print(f"Wrote mean image to {output_image}")
        ffs[0][0].data = rmean.data
        ffs[0].writeto(output_residual, overwrite=True) 
        print(f"Wrote mean residual to {output_residual}")

  save-ms-info:
    flavour: python-code
    name: save-ms-info
    command: |
      from omegaconf import OmegaConf
      import casacore.tables
      tab = casacore.tables.table(ms)
      info = OmegaConf.create()
      info.num_intervals = len(set(tab.getcol("TIME")))
      info.intervals = sorted(map(float, set(tab.getcol("INTERVAL"))))
      print(f"MS has {info.num_intervals} timeslots of interval {info.intervals}")
      info.total = [i*info.num_intervals/3600. for i in info.intervals]
      print(f"Total synthesis time is {info.total}h")
      OmegaConf.save(info, ms_info_file)
    inputs:
      ms: 
        dtype: MS
    outputs:
      ms-info-file:
        dtype: File

  load-ms-info:
    flavour: python-code
    command: |
      from omegaconf import OmegaConf
      info = OmegaConf.load(ms_info_file)
      num_intervals = info.num_intervals
    inputs:
      ms-info-file: 
        dtype: File
    outputs:
      num_intervals:
        dtype: int
     


lib:
  recipes:
    fft-image-list:
      inputs:
        image-list:
          dtype: List[File]
          required: true
      for_loop:
        var: image
        over: image-list
      steps:
        fft-image:
          cab: fft-image
          params:
            image: =recipe.image
            fft-image: =STRIPEXT(current.image) + ".fft.fits"
            lambda-per-arcsec: 100

  steps:
    mean-cubes:
      recipe:
        name: mean_iquv
        inputs:
          prefix:
            dtype: str
        for_loop:
          var: stokes
          over: [I, Q, U, V]
        steps:
          mean-image:
            cab: weighted-mean-image
            params:
              images: =GLOB("{recipe.prefix}-t????-MFS-{recipe.stokes}-image.fits")
              residuals: =GLOB("{recipe.prefix}-t????-MFS-{recipe.stokes}-residual.fits")
              output_image: "{recipe.prefix}-mean-MFS-{recipe.stokes}-image.fits"
              output_residual: "{recipe.prefix}-mean-MFS-{recipe.stokes}-residual.fits"
          fft-mean-residual:
            cab: fft-image
            params:
              image: =previous.output_residual
              fft-image: =STRIPEXT(previous.output_residual) + ".fft.fits"
              lambda-per-arcsec: 100
      params:
        prefix: "{recipe.image-upsample-prefix}"
        
    wsclean:
      base:
        info: "base wsclean settings"
        cab: wsclean
        params:
          ms: ='{recipe.msdir}/target.ms'
          prefix: ="{recipe.imdir}/image_{info.suffix}/"
          column: CORRECTED{info.suffix}_DATA
          size: =recipe.wsclean_size
          scale: =recipe.wsclean_scale
          padding: 1.3
          wstack-nwlayers-factor: 3
          nchan: =recipe.wsclean_nchan
          temp-dir: /data/ncharles/tmp
          use-wgridder: true
          log-time: true
         #  minuv-l: =IF(recipe.inner-taper.enable, recipe.inner-taper.cut, UNSET)
         #  taper-inner-tukey: =IF(recipe.inner-taper.enable, recipe.inner-taper.taper, UNSET)
      
   
         

      dirty:
        _use: lib.steps.wsclean.base
        info: "wsclean step for dirty-only image"
        params:
          column: CORRECTED_DATA
          weight: 'briggs 0'
          niter: 0
          # parallel_gridding: 64

      dirty_pol:
        _use: lib.steps.wsclean.dirty
        info: "wsclean step for dirty-only IQUV image"
        params:
          pol: IQUV

      image:
        _use: lib.steps.wsclean.dirty
        info: "wsclean step for imaging"
        params:
          column: CORRECTED_DATA
          mgain: 0.9
          weight: =recipe.wsclean_weight
          fit-beam: true
          elliptical-beam: true
          parallel-deconvolution: 1500
          niter: 10000
          join-channels: true
          fit-spectral-pol: 4
          
          
          

      image_pol:
        _use: lib.steps.wsclean.image
        info: "wsclean step for IQUV imaging"
        params:
          join-polarizations: true
          fit-spectral-pol: =UNSET 
          pol: IQUV
          auto-mask : =UNSET
          auto-threshold: 3
        
      image_pol_interval_out:
        _use: lib.steps.wsclean.image_pol
        info: "wsclean step for IQUV imaging"
        params:
          multiscale: true
          intervals-out: 5
          auto-threshold: 3

      image_pol2:
        _use: lib.steps.wsclean.image_pol
        info: "wsclean step for IQ imaging"
        params:
          pol: IQ

      predict:
        _use: lib.steps.wsclean.base
        info: "wsclean step for predicting a model"
        params:
          predict: true

      predict_pol:
        _use: lib.steps.wsclean.predict
        info: "wsclean step for predicting an IQUV model"
        params:
          predict: true
          pol: IQUV

      predict_pol2:
        _use: lib.steps.wsclean.predict_pol
        info: "wsclean step for predicting an IQ model"
        params:
          pol: IQ

